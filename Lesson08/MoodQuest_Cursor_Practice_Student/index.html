<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoodQuest</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow">MoodQuest</p>
      <h1>Do Something</h1>
      <p>Pick things and get an idea.</p>
    </header>

    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Choose</h2>
      <form id="quest-form">
        <label for="mood">1</label>
        <select id="mood" name="mood">
          <option value="">Select</option>
          <option value="energetic">Energetic</option>
          <option value="creative">Creative</option>
          <option value="calm">Calm</option>
          <option value="social">Social</option>
        </select>

        <label for="time">2</label>
        <select id="time" name="time">
          <option value="">Select</option>
          <option value="10">10</option>
          <option value="30">30</option>
          <option value="60">60+</option>
        </select>

        <fieldset>
          <legend>3</legend>
          <label><input type="radio" name="place" value="indoor" /> In</label>
          <label><input type="radio" name="place" value="outdoor" /> Out</label>
          <label><input type="radio" name="place" value="either" /> Either</label>
        </fieldset>

        <div class="button-row">
          <button type="submit" class="primary-button">Go</button>
          <button type="button" id="reset-button" class="icon-button" aria-label="Reset">↻</button>
        </div>
      </form>
    </section>

    <section id="result" class="result" aria-live="polite"></section>
  </main>
  <script src="script.js"></script>
</body>
</html>
